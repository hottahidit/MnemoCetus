[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemocetus"
dynamic = ["version"]
description = "A local developer-workspace scanner: find, classify, size, clean and secure your projects."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "rich",
    "questionary>=2.0",
    "flask",
]
keywords = ["workspace", "scanner", "developer-tools", "secrets", "disk-usage", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: System :: Filesystems",
]

[project.scripts]
nemc = "mnemocetus.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "mnemocetus.__version__" }

[tool.setuptools.packages.find]
include = ["mnemocetus*"]
exclude = ["mnemocetus.tests*"]

[tool.setuptools.package-data]
mnemocetus = [
    "exclude_list/default_exclude_list.txt",
    "db/schema.sql",
    "web/templates/*.html",
]
